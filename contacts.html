<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="icons/bootstrap-icons.css" rel="stylesheet">
  </head>
  <body>
    <div class="bg-dark text-white p-3 d-flex flex-column"
         style="width: 245px; height: 100vh; position: fixed;">
        <h4 class="d-flex align-items-center gap-2">
            <i class="bi bi-bootstrap"></i>
            Меню
        </h4>
        <div class="p-2">
            <i class="bi bi-house"></i>
          Главная
        </div>
      <div class="p-2">
          <i class="bi bi-speedometer2"></i>
          Категории
      </div>
      <div class="p-2">
          <i class="bi bi-table"></i>
          Заказы
      </div>
      <div class="bg-primary p-2 rounded">
          <i class="bi bi-person-circle"></i>
          Контакты
      </div>
      <div class="mt-auto">
          <div class="bg-secondary rounded w-75">
              <div class="p-2">
                  Профиль
              </div>
              <div class="p-2 border-top border-dark">
                  Выход
              </div>
          </div>
          <hr>
          <div class="dropdown">
              <button class="btn text-white dropdown-toggle">
                  <img src="images/1_картинка.jpg" class="rounded-circle" width="30" height="30" alt="Пользователь">
                  Пользователь
              </button>
              <ul class="dropdown-menu">
                  <li><button class="dropdown-item" type="button">Профиль</button></li>
                  <li><button class="dropdown-item" type="button">Выход action</button></li>
              </ul>
              </div>
          </div>
      </div>
    <div style="margin-left: 245px;" class="p-5">
        <div class="text-center mt-5 mb-5">
        <h1>Контакты</h1>
        </div>
        <div class="row g-4">
            <div class="col-md-5">
                 <div class="card">
                     <div class="card-body">
                         <div class="mb-3">
                            <label class="form-label">Имя</label>
                             <input type="text" class="form-control">
                         </div>
                         <div class="mb-3">
                            <label class="form-label">Почта</label>
                             <div class="input-group">
                                 <span class="input-group-text">@</span>
                                 <input type="email" class="form-control">
                             </div>
                         </div>
                         <div class="mb-3">
                             <label class="form-label">Сообщение</label>
                             <textarea class="form-control" rows="3"></textarea>
                         </div>
                         <button class="btn btn-primary">Отправить</button>
                     </div>
                 </div>
            </div>
            <div class="col-md-5">
                <h4>Наши контакты</h4>
                <p>Пиши, если срочно нужно посмеяться или просто пожаловаться на жизнь</p>
                <p>Отвечаю не всегда, но искренне</p>
                <p>В рабочее время-супергерой, в остальное-просто человек с чашкой кофе</p>
            </div>
        </div>
    </div>
  </body>
</html>
